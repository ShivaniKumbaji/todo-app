<!DOCTYPE html>
<html>
<head>
    <title>Edit Task</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">

<h3>Edit Task</h3>

<form method="POST" class="card p-3 shadow-sm">
    <input name="title" value="{{ task.title }}" class="form-control mb-2">
    <textarea name="description" class="form-control mb-2">{{ task.description }}</textarea>

    <select name="priority" class="form-select mb-2">
        <option {{ 'selected' if task.priority=='High' }}>High</option>
        <option {{ 'selected' if task.priority=='Medium' }}>Medium</option>
        <option {{ 'selected' if task.priority=='Low' }}>Low</option>
    </select>

    <select name="status" class="form-select mb-2">
        <option {{ 'selected' if task.status=='Pending' }}>Pending</option>
        <option {{ 'selected' if task.status=='Completed' }}>Completed</option>
    </select>

    <input type="date" name="due_date" class="form-control mb-3"
           value="{{ task.due_date }}">

    <button class="btn btn-success">Update Task</button>
    <a href="/" class="btn btn-secondary">Cancel</a>
</form>

</body>
</html>
